<a class="skip-link" href="#main-content">Skip to main content</a>

@if (isHeaderVisible()) {
  <header class="phone-status-bar" aria-label="Device status">
    <span class="phone-status-bar__time">{{ currentTime() }}</span>

    <span
      class="phone-status-bar__store-status"
      [class]="'phone-status-bar__store-status--' + storeStateStyle()"
    >
      {{ storeState() }}
    </span>
  </header>
}

<main id="main-content" [class.with-chrome]="isHeaderVisible()">
  <router-outlet />
</main>
