@if (isHeaderVisible()) {
  <header class="phone-status-bar" aria-label="Device status">
    <span class="phone-status-bar__time">{{ currentTime() }}</span>

    <span
      class="phone-status-bar__store-status"
      [class]="'phone-status-bar__store-status--' + storeStateStyle()"
    >
      {{ storeState() }}
    </span>
  </header>
}

<main id="main-content" [class.with-chrome]="isHeaderVisible()" class="app-main">
  <router-outlet />
</main>

@if (isHeaderVisible()) {
  <footer class="app-footer" role="contentinfo">
    <nav class="app-footer__nav" aria-label="Main navigation">
      @for (item of footerNavItems; track item.path) {
        <a
          routerLink="{{ item.path }}"
          class="app-footer__link"
          [class.app-footer__link--active]="item.path === currentPath()"
          [aria-label]="item.label"
        >
          @if (item.path === currentPath()) {
            <img src="{{ item.activeIcon }}" alt="{{ item.label }}" class="app-footer__icon" />
          } @else {
            <img src="{{ item.icon }}" alt="{{ item.label }}" class="app-footer__icon" />
          }
        </a>
      }
    </nav>
  </footer>
}
