<header class="app-header">

  <!-- Centered Logo -->
  <div class="logo">
    <a routerLink=""><img src="assets/icons/last_stop_brewing_logo.svg" alt="Logo"></a>
  </div>

  <!-- Hamburger Menu -->
  <button class="hamburger-button" (click)="toggleMenu()">
    <img src="assets/LastStopBrewingX_1.png" class="hamburger-line line1" [class.open]="isActive">
    <img src="assets/LastStopBrewingX_2.png" class="hamburger-line line2" [class.open]="isActive">
    <img src="assets/LastStopBrewingX_1.png" class="hamburger-line line3" [class.open]="isActive">
  </button>

  <div class="header-menu">
    <a routerLink="" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: true}">Home</a>
    <a routerLink="beers" routerLinkActive="active-link">Beers</a>
    <a routerLink="food" routerLinkActive="active-link">Food</a>
    <a routerLink="events" routerLinkActive="active-link">Events</a>
    <a routerLink="about" routerLinkActive="active-link">About</a>
    <a routerLink="contact" routerLinkActive="active-link">Contact</a>
  </div>

  <!-- Dropdown Menu -->
  <div class="full-screen-menu" [class.open]="isActive">
    <ul (click)="toggleMenu()">
      <li><a routerLink="" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: true}">Home</a></li>
      <li><a routerLink="beers" routerLinkActive="active-link">Beers</a></li>
      <li><a routerLink="food" routerLinkActive="active-link">Food</a></li>
      <li><a routerLink="events" routerLinkActive="active-link">Events</a></li>
      <li><a routerLink="about" routerLinkActive="active-link">About</a></li>
      <li><a routerLink="contact" routerLinkActive="active-link">Contact</a></li>
    </ul>
  </div>
</header>
