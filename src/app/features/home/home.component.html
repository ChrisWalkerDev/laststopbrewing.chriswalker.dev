<div class="hero">
  <div class="carousel">
    @for (slide of slides; track $index; let i = $index) {
    <div class="slide" [class.active]="i === currentIndex">
      <!-- <img [src]="slide.image" [alt]="slide.title" /> -->
      <div class="overlay">
        <h1>{{ slide.title }}</h1>
        <p>{{ slide.description }}</p>
      </div>
    </div>
    }

    <button class="prev" (click)="prevSlide()">❮</button>
    <button class="next" (click)="nextSlide()">❯</button>
  </div>
</div>
<div class="home-footer">
  <div class="home-foot-left"><a routerLink="beers">Beer Menu</a></div>
  <div class="home-foot-right"><a routerLink="food">Food Menu</a></div>
</div>
