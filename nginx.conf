server {
  listen 8080;
  server_tokens off;
  sendfile on;
  default_type application/octet-stream;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self' https://email-service.chriswalker.dev; frame-src 'self' https://business.untappd.com https://www.google.com; img-src 'self' data: https://business.untappd.com https://www.google.com https://maps.gstatic.com; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://email-service.chriswalker.dev; font-src 'self' data:;" always;

  gzip on;
  gzip_http_version 1.1;
  gzip_disable      "MSIE [1-6]\.";
  gzip_min_length   256;
  gzip_vary         on;
  gzip_proxied      expired no-cache no-store private auth;
  gzip_types        text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;
  gzip_comp_level   9;

  root /usr/share/nginx/html;

  location /version {
    add_header Content-Type application/json;
    return 200 "{ 'version': '${VERSION}' }";
  }

  location / {
    try_files $uri $uri/ /index.html =404;
  }
}
